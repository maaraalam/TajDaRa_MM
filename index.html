x 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 60px rgba(0,0,0,.45)}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#111a14}.signal-box{border:1px solid #4c654f;background:#1d2b20;border-radius:16px;padding:13px}.signal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.grade{font-size:24px;font-weight:900;color:var(--matcha2)}.mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table td{padding:7px 0;border-bottom:1px solid #2b3c30}.mini-table td:last-child{text-align:right;font-weight:700}.journal-head{display:flex;justify-content:space-between;gap:10px}.journal-actions{display:flex;gap:8px;margin-top:12px}.journal-actions .btn{flex:1}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);background:#d6e6cc;color:#172018;padding:10px 15px;border-radius:999px;font-weight:800;box-shadow:var(--shadow)}.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stat{background:#111a14;border:1px solid var(--line);border-radius:12px;padding:10px}.stat .v{font-size:15px;font-weight:800;margin-top:4px}.reason{font-size:12px;line-height:1.5;color:#c1d0c3}.toolbar{display:grid;grid-template-columns:1fr 110px;gap:8px}.warning{background:#302918;border:1px solid #5a4b25;color:#e7d9a7;padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.45}.footer-note{font-size:11px;line-height:1.5;color:#859888}@media(min-width:720px){html,body{font-size:17px}.metric{font-size:32px}.nav-btn small{font-size:10px}.modal{align-items:center;padding:30px}.modal-card{border-radius:24px}.analysis-grid{grid-template-columns:repeat(4,1fr)}}

  <script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const now=()=>new Date().toISOString();
const VENUE_LABEL={TX:'TX',NX:'NX',DX:'DX'};
const AUTH_KEY='tajdara_mm_auth_v1';
const LOCK_TIMEOUT_MS=10*60*1000;
let appStarted=false,refreshTimer=null,lockTimer=null;
function b64(bytes){return btoa(String.fromCharCode(...bytes));}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function passwordHash(password,salt,iterations=180000){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256);
  return b64(new Uint8Array(bits));
}
function authConfig(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{return null}}
function lockMarkup(mode='unlock'){
  const setup=mode==='setup';
  $('#lockBody').innerHTML=`<div class="field"><label>${setup?'Create Password':'Password'}</label><input id="lockPass" type="password" autocomplete="${setup?'new-password':'current-password'}" placeholder="${setup?'Minimum 6 characters':'Enter password'}"></div>${setup?'<div class="field"><label>Confirm Password</label><input id="lockPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>':''}<button id="lockAction" class="btn block">${setup?'Create Password':'Unlock'}</button><div id="lockError" class="lock-error"></div><div class="security-note">Password verification is local to this device. No account connection or password is sent to NX, TX, DX, GitHub or any server.</div>`;
  $('#lockAction').onclick=setup?createLocalPassword:unlockApp;
  $('#lockPass').addEventListener('keydown',e=>{if(e.key==='Enter'&&!setup)unlockApp()});
  setTimeout(()=>$('#lockPass')?.focus(),100);
}
function showLock(mode='unlock'){$('#lockScreen').classList.remove('hidden');lockMarkup(mode)}
function hideLock(){$('#lockScreen').classList.add('hidden')}
async function createLocalPassword(){
  const p=$('#lockPass').value,p2=$('#lockPass2').value,err=$('#lockError');
  if(p.length<6){err.textContent='Use at least 6 characters.';return}
  if(p!==p2){err.textContent='Passwords do not match.';return}
  try{const salt=crypto.getRandomValues(new Uint8Array(16));const iterations=180000;const hash=await passwordHash(p,salt,iterations);localStorage.setItem(AUTH_KEY,JSON.stringify({salt:b64(salt),hash,iterations,createdAt:Date.now()}));hideLock();startApp();toast('Password created');}catch(e){err.textContent='Could not create password on this device.'}
}
async function verifyPassword(p){const a=authConfig();if(!a)return false;const h=await passwordHash(p,unb64(a.salt),a.iterations||180000);return h===a.hash}
async function unlockApp(){const p=$('#lockPass').value,err=$('#lockError');err.textContent='Checking…';try{if(await verifyPassword(p)){err.textContent='';hideLock();startApp();resetLockTimer()}else err.textContent='Incorrect password.'}catch(e){err.textContent='Could not verify password.'}}
function lockNow(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}showLock('unlock')}
function resetLockTimer(){if($('#lockScreen')&&!$('#lockScreen').classList.contains('hidden'))return;clearTimeout(lockTimer);lockTimer=setTimeout(lockNow,LOCK_TIMEOUT_MS)}
async function changePasswordModal(){modal(`<h2>Change Password</h2><div class="form-grid"><div class="field full"><label>Current Password</label><input id="cpOld" type="password" autocomplete="current-password"></div><div class="field full"><label>New Password</label><input id="cpNew" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"></div><div class="field full"><label>Confirm New Password</label><input id="cpNew2" type="password" autocomplete="new-password"></div></div><div id="cpError" class="lock-error"></div><div class="hr"></div><button class="btn block" onclick="saveNewPassword()">Change Password</button>`)}
async function saveNewPassword(){const old=$('#cpOld').value,n=$('#cpNew').value,n2=$('#cpNew2').value,err=$('#cpError');if(!(await verifyPassword(old))){err.textContent='Current password is incorrect.';return}if(n.length<6){err.textContent='Use at least 6 characters.';return}if(n!==n2){err.textContent='New passwords do not match.';return}const salt=crypto.getRandomValues(new Uint8Array(16)),iterations=180000,hash=await passwordHash(n,salt,iterations);localStorage.setItem(AUTH_KEY,JSON.stringify({salt:b64(salt),hash,iterations,createdAt:Date.now()}));closeModal();toast('Password changed')}
function startApp(){if(!appStarted){appStarted=true;render();refreshPrices();}else{render();refreshPrices()}if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refreshPrices,60000);resetLockTimer()}
function boot(){const a=authConfig();showLock(a?'unlock':'setup')}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(appStarted)resetLockTimer()},{passive:true}));
const DEFAULTS={settings:{capital:400000000,riskPct:1,dxGoldPrice:0,timeframe:'1h'},symbols:[
 {venue:'TX',symbol:'BTCUSDT',label:'BTC / USDT'},
 {venue:'TX',symbol:'ETHUSDT',label:'ETH / USDT'},
 {venue:'TX',symbol:'SOLUSDT',label:'SOL / USDT'},
 {venue:'NX',symbol:'USDTIRT',label:'USDT / IRT'},
 {venue:'NX',symbol:'BTCIRT',label:'BTC / IRT'},
 {venue:'NX',symbol:'ETHIRT',label:'ETH / IRT'},
 {venue:'DX',symbol:'GOLD18',label:'Digital Gold'}],journal:[]};
function load(){let x;try{x=JSON.parse(localStorage.getItem('tajdara_mm_v4')||'null')}catch{};let base=structuredClone(DEFAULTS);if(!x)return base;return {...base,...x,settings:{...base.settings,...(x.settings||{})},symbols:x.symbols||base.symbols,journal:x.journal||[]};}
let state=load(),prices={},tab='dashboard',analysisCache={};
function save(){localStorage.setItem('tajdara_mm_v4',JSON.stringify(state));}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function modal(html){$('#modalCard').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
async function txTicker(symbol){let r=await fetch(`https://api.toobit.com/quote/v1/ticker/24hr?symbol=${encodeURIComponent(symbol)}`);let d=await r.json();if(Array.isArray(d))d=d[0];return {price:+(d.c||d.lastPrice||d.p||0),change:+(d.pcp||d.priceChangePercent||0)};}
async function nxTicker(symbol){let r=await fetch(`https://apiv2.nobitex.ir/v3/orderbook/${encodeURIComponent(symbol)}`);let d=await r.json();let f=symbol.endsWith('IRT')?10:1;return {price:+d.lastTradePrice/f,change:0};}
async function refreshPrices(){let tasks=state.symbols.map(async s=>{try{if(s.venue==='TX')prices[s.symbol]=await txTicker(s.symbol);else if(s.venue==='NX')prices[s.symbol]=await nxTicker(s.symbol);else prices[s.symbol]={price:+state.settings.dxGoldPrice||0,change:0};}catch(e){prices[s.symbol]=prices[s.symbol]||{price:0,change:0,error:true}}});await Promise.all(tasks);render();toast('Market data refreshed');}
function nav(){$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function render(){nav();({dashboard:renderDashboard,markets:renderMarkets,analysis:renderAnalysis,planner:renderPlanner,journal:renderJournal,settings:renderSettings}[tab])();}
function realizedPL(t){let buys=(t.fills||[]).filter(f=>f.type==='BUY'),sells=(t.fills||[]).filter(f=>f.type==='SELL');let bq=buys.reduce((a,x)=>a+x.qty,0),bc=buys.reduce((a,x)=>a+x.qty*x.price+(x.fee||0),0),sq=sells.reduce((a,x)=>a+x.qty,0),sv=sells.reduce((a,x)=>a+x.qty*x.price-(x.fee||0),0);let avg=bq?bc/bq:0;return {bq,sq,avg,pl:sv-sq*avg,open:Math.max(0,bq-sq)};}
function renderDashboard(){let realized=state.journal.reduce((a,t)=>a+realizedPL(t).pl,0),open=state.journal.filter(t=>realizedPL(t).open>0).length;$('#view').innerHTML=`<div class="grid two"><div class="card"><div class="label">Trading Capital</div><div class="metric">${fmt(state.settings.capital,0)}</div><div class="subtle">TOMAN</div></div><div class="card"><div class="label">Realized P/L</div><div class="metric small ${realized>=0?'pos':'neg'}">${fmt(realized,0)}</div><div class="subtle">TOMAN</div></div><div class="card"><div class="label">Open Trades</div><div class="metric">${open}</div></div><div class="card"><div class="label">Risk / Trade</div><div class="metric">${fmt(state.settings.riskPct,1)}%</div></div></div><div class="section-title"><h2>Watchlist</h2><button onclick="refreshPrices()">Refresh</button></div><div class="card">${state.symbols.slice(0,7).map(marketRow).join('')}</div><div class="warning">Public market data only. No account connection, API key, balance access, order access or automatic execution exists in this mobile edition.</div>`;}
function marketRow(s){let p=prices[s.symbol]||{},val=p.price?fmt(p.price,p.price<100?4:0):'—';return `<div class="market-row" onclick="openMarket('${s.venue}','${s.symbol}')"><div><div class="symbol">${s.label}</div><div class="venue">${VENUE_LABEL[s.venue]}</div></div><div><div class="price">${val}</div><div class="chg ${p.change>=0?'pos':'neg'}">${p.change?fmt(p.change,2)+'%':' '}</div></div></div>`;}
function renderMarkets(){$('#view').innerHTML=`<div class="section-title"><h2>Markets</h2><button onclick="addSymbolModal()">+ Symbol</button></div><div class="card">${state.symbols.map(s=>marketRow(s)+`<div class="row" style="margin:-6px 0 8px"><div class="spacer"></div><button class="btn secondary" onclick="event.stopPropagation();removeSymbol('${s.venue}','${s.symbol}')">Remove</button></div>`).join('')}</div>`;}
function addSymbolModal(){modal(`<h2>Add Market</h2><div class="form-grid"><div class="field full"><label>Venue</label><select id="mVenue"><option>TX</option><option>NX</option><option>DX</option></select></div><div class="field full"><label>Symbol</label><input id="mSymbol" placeholder="e.g. XRPUSDT or DOGEIRT"></div><div class="field full"><label>Display Name</label><input id="mLabel" placeholder="e.g. XRP / USDT"></div></div><div class="hr"></div><button class="btn block" onclick="addSymbol()">Add Market</button>`);}
function addSymbol(){let venue=$('#mVenue').value,symbol=$('#mSymbol').value.trim().toUpperCase(),label=$('#mLabel').value.trim()||symbol;if(!symbol)return;state.symbols.push({venue,symbol,label});save();closeModal();render();refreshPrices();}
function removeSymbol(v,s){state.symbols=state.symbols.filter(x=>!(x.venue===v&&x.symbol===s));save();render();}
function tfToTX(tf){return {'15m':'15m','30m':'30m','1h':'1h','4h':'4h','1d':'1d'}[tf]||'1h'}
function tfToNX(tf){return {'15m':15,'30m':30,'1h':60,'4h':240,'1d':'D'}[tf]||60}
async function candles(v,s,tf='1h',limit=120){try{if(v==='TX'){let r=await fetch(`https://api.toobit.com/quote/v1/klines?symbol=${s}&interval=${tfToTX(tf)}&limit=${limit}`),d=await r.json();return d.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+(x[5]||0)}));}if(v==='NX'){let mult={'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400}[tf]||3600,to=Math.floor(Date.now()/1000),from=to-limit*mult;let r=await fetch(`https://apiv2.nobitex.ir/market/udf/history?symbol=${s}&resolution=${tfToNX(tf)}&from=${from}&to=${to}`),d=await r.json(),f=s.endsWith('IRT')?10:1;return (d.t||[]).map((_,i)=>({t:+d.t[i]*1000,o:+d.o[i]/f,h:+d.h[i]/f,l:+d.l[i]/f,c:+d.c[i]/f,v:+(d.v?.[i]||0)}));}}catch(e){}return[];}
function ema(vals,n){if(!vals.length)return 0;let k=2/(n+1),e=vals[0];for(let i=1;i<vals.length;i++)e=vals[i]*k+e*(1-k);return e;}
function rsi(vals,n=14){if(vals.length<n+1)return 50;let g=0,l=0;for(let i=vals.length-n;i<vals.length;i++){let d=vals[i]-vals[i-1];if(d>0)g+=d;else l-=d;}g/=n;l/=n;if(!l)return 100;return 100-100/(1+g/l);}
function atr(rows,n=14){if(rows.length<2)return 0;let trs=[];for(let i=1;i<rows.length;i++){let x=rows[i],pc=rows[i-1].c;trs.push(Math.max(x.h-x.l,Math.abs(x.h-pc),Math.abs(x.l-pc)));}return trs.slice(-n).reduce((a,b)=>a+b,0)/Math.min(n,trs.length);}
function pivots(rows,left=2,right=2){let hs=[],ls=[];for(let i=left;i<rows.length-right;i++){let h=rows[i].h,l=rows[i].l;if(rows.slice(i-left,i).every(x=>h>x.h)&&rows.slice(i+1,i+right+1).every(x=>h>=x.h))hs.push([i,h]);if(rows.slice(i-left,i).every(x=>l<x.l)&&rows.slice(i+1,i+right+1).every(x=>l<=x.l))ls.push([i,l]);}return [hs,ls];}
function analyzeRows(rows){let out={side:'WAIT',grade:'C',score:0,trend:'RANGE',bos:'NONE',choch:'NONE',sweep:'NONE',ema20:0,ema50:0,rsi14:50,atr14:0,price:0,entryLow:0,entryHigh:0,stop:0,tp1:0,tp2:0,rr1:0,rr2:0,reasons:[]};if(rows.length<60){out.reasons=['Need at least 60 candles'];return out;}let c=rows.map(x=>x.c),vol=rows.map(x=>x.v||0),last=rows.at(-1);out.price=last.c;out.ema20=ema(c.slice(-80),20);out.ema50=ema(c.slice(-120),50);out.rsi14=rsi(c);out.atr14=atr(rows);let score=0;if(out.price>out.ema20&&out.ema20>out.ema50){out.trend='UP';score+=2;out.reasons.push('Price > EMA20 > EMA50');}else if(out.price<out.ema20&&out.ema20<out.ema50){out.trend='DOWN';score-=2;out.reasons.push('Price < EMA20 < EMA50');}else out.reasons.push('Mixed EMA structure');let [hs,ls]=pivots(rows),prevH=hs.length?hs.at(-1)[1]:Math.max(...rows.slice(-20,-1).map(x=>x.h)),prevL=ls.length?ls.at(-1)[1]:Math.min(...rows.slice(-20,-1).map(x=>x.l));if(out.price>prevH){out.bos='BULLISH';score+=2;out.reasons.push('Bullish BOS');if(out.trend==='DOWN'){out.choch='BULLISH';score++;out.reasons.push('Bullish CHoCH');}}else if(out.price<prevL){out.bos='BEARISH';score-=2;out.reasons.push('Bearish BOS');if(out.trend==='UP'){out.choch='BEARISH';score--;out.reasons.push('Bearish CHoCH');}}if(last.l<prevL&&out.price>prevL){out.sweep='SELL-SIDE';score+=2;out.reasons.push('Sell-side liquidity sweep + reclaim');}else if(last.h>prevH&&out.price<prevH){out.sweep='BUY-SIDE';score-=2;out.reasons.push('Buy-side liquidity sweep + rejection');}if(out.rsi14<32){score++;out.reasons.push('RSI oversold');}else if(out.rsi14>68){score--;out.reasons.push('RSI overbought');}else out.reasons.push('RSI neutral');let av=vol.slice(-21,-1).filter(Boolean);let avgVol=av.length?av.reduce((a,b)=>a+b,0)/av.length:0;if(avgVol&&last.v>avgVol*1.35){if(last.c>last.o){score++;out.reasons.push('Bullish volume expansion');}else{score--;out.reasons.push('Bearish volume expansion');}}let rhi=Math.max(...rows.slice(-30).map(x=>x.h)),rlo=Math.min(...rows.slice(-30).map(x=>x.l)),span=Math.max(rhi-rlo,1e-12),loc=(out.price-rlo)/span;if(loc<.28){score++;out.reasons.push('Price near lower recent range');}else if(loc>.72){score--;out.reasons.push('Price near upper recent range');}let a=Math.max(out.atr14,out.price*.001);if(score>=2){out.side='LONG';out.entryLow=out.price-a*.35;out.entryHigh=out.price+a*.08;out.stop=out.price-a*1.25;let risk=out.price-out.stop;out.tp1=out.price+risk*1.7;out.tp2=out.price+risk*2.8;}else if(score<=-2){out.side='SHORT';out.entryLow=out.price-a*.08;out.entryHigh=out.price+a*.35;out.stop=out.price+a*1.25;let risk=out.stop-out.price;out.tp1=out.price-risk*1.7;out.tp2=out.price-risk*2.8;}if(out.side!=='WAIT'){let risk=Math.abs(out.price-out.stop);out.rr1=Math.abs(out.tp1-out.price)/risk;out.rr2=Math.abs(out.tp2-out.price)/risk;}let confirms=[out.bos!=='NONE',out.choch!=='NONE',out.sweep!=='NONE',avgVol&&last.v>avgVol*1.35].filter(Boolean).length,abs=Math.abs(score);out.grade=out.side!=='WAIT'&&abs>=5&&confirms>=2&&out.rr2>=2.5?'A':out.side!=='WAIT'&&abs>=3&&out.rr1>=1.5?'B':'C';out.score=score;return out;}
async function openMarket(v,s){let sym=state.symbols.find(x=>x.venue===v&&x.symbol===s),p=prices[s]||{};modal(`<h2>${sym?.label||s}</h2><div class="row"><span class="pill">${VENUE_LABEL[v]}</span><div class="spacer"></div><strong>${p.price?fmt(p.price,p.price<100?4:0):'—'}</strong></div><div class="hr"></div><div class="toolbar"><select id="chartTf" onchange="redrawMarket('${v}','${s}')"><option>15m</option><option>30m</option><option selected>1h</option><option>4h</option><option>1d</option></select><button class="btn secondary" onclick="runMarketAnalysis('${v}','${s}')">Analyze</button></div><div class="hr"></div><canvas id="chart" width="760" height="420"></canvas><div id="marketAnalysis"></div><div class="hr"></div><button class="btn block" onclick="prefillPlanner('${v}','${s}')">Create Trade Plan</button>`);redrawMarket(v,s);}
async function redrawMarket(v,s){let tf=$('#chartTf')?.value||'1h',rows=await candles(v,s,tf,120);drawChart(rows);}
function drawChart(rows){let c=$('#chart');if(!c)return,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#111a14';ctx.fillRect(0,0,c.width,c.height);if(!rows.length){ctx.fillStyle='#9eafa5';ctx.font='20px sans-serif';ctx.fillText('Chart unavailable. Use public quote / manual plan.',28,62);return;}let lo=Math.min(...rows.map(x=>x.l)),hi=Math.max(...rows.map(x=>x.h)),pad=35,w=(c.width-pad*2)/rows.length,y=p=>pad+(hi-p)/(hi-lo||1)*(c.height-pad*2);ctx.strokeStyle='#2d4035';for(let i=0;i<5;i++){let yy=pad+i*(c.height-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(c.width-pad,yy);ctx.stroke();}rows.forEach((x,i)=>{let xx=pad+i*w+w/2,up=x.c>=x.o;ctx.strokeStyle=up?'#a9d39a':'#e48b8b';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(xx,y(x.h));ctx.lineTo(xx,y(x.l));ctx.stroke();let yo=y(x.o),yc=y(x.c);ctx.fillRect(xx-w*.29,Math.min(yo,yc),Math.max(1,w*.58),Math.max(2,Math.abs(yc-yo)));});let sig=analyzeRows(rows);let e20=ema(rows.map(x=>x.c),20),e50=ema(rows.map(x=>x.c),50);function line(vals,col){ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();vals.forEach((p,i)=>{let xx=pad+i*w+w/2,yy=y(p);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)});ctx.stroke();}let v=rows.map(x=>x.c),a20=[],a50=[];for(let i=0;i<v.length;i++){a20.push(ema(v.slice(0,i+1),20));a50.push(ema(v.slice(0,i+1),50));}line(a20,'#c7d9a8');line(a50,'#729b75');ctx.fillStyle='#d7e8cf';ctx.font='15px sans-serif';ctx.fillText(`Last ${fmt(rows.at(-1).c,rows.at(-1).c<100?4:0)}  EMA20 ${fmt(e20,2)}  EMA50 ${fmt(e50,2)}`,pad,22);}
async function runMarketAnalysis(v,s){let tf=$('#chartTf')?.value||'1h',rows=await candles(v,s,tf,140),sig=analyzeRows(rows);analysisCache[`${v}|${s}|${tf}`]=sig;$('#marketAnalysis').innerHTML=signalHTML(sig,v,s,tf);}
function signalHTML(sig,v,s,tf){let sideCls=sig.side==='LONG'?'pos':sig.side==='SHORT'?'neg':'amber';return `<div class="hr"></div><div class="signal-box"><div class="signal-head"><div><div class="label">${VENUE_LABEL[v]} · ${s} · ${tf}</div><div class="metric small ${sideCls}">${sig.side}</div></div><div class="grade">${sig.grade}</div></div><div class="analysis-grid"><div class="stat"><div class="label">Trend</div><div class="v">${sig.trend}</div></div><div class="stat"><div class="label">BOS</div><div class="v">${sig.bos}</div></div><div class="stat"><div class="label">CHoCH</div><div class="v">${sig.choch}</div></div><div class="stat"><div class="label">Sweep</div><div class="v">${sig.sweep}</div></div><div class="stat"><div class="label">RSI14</div><div class="v">${fmt(sig.rsi14,1)}</div></div><div class="stat"><div class="label">ATR14</div><div class="v">${fmt(sig.atr14,4)}</div></div><div class="stat"><div class="label">Score</div><div class="v">${sig.score}</div></div><div class="stat"><div class="label">R:R TP2</div><div class="v">${fmt(sig.rr2,2)}</div></div></div><div class="hr"></div><table class="mini-table"><tr><td>Entry zone</td><td>${fmt(sig.entryLow,4)} – ${fmt(sig.entryHigh,4)}</td></tr><tr><td>Invalidation / Stop</td><td>${sig.stop?fmt(sig.stop,4):'—'}</td></tr><tr><td>TP1</td><td>${sig.tp1?fmt(sig.tp1,4):'—'}</td></tr><tr><td>TP2</td><td>${sig.tp2?fmt(sig.tp2,4):'—'}</td></tr></table><div class="hr"></div><div class="reason">${sig.reasons.join(' · ')}</div></div>`;}
function renderAnalysis(){let opts=state.symbols.filter(s=>s.venue!=='DX').map(s=>`<option value="${s.venue}|${s.symbol}">${VENUE_LABEL[s.venue]} · ${s.label}</option>`).join('');$('#view').innerHTML=`<div class="section-title"><h2>Smart Market Analysis</h2></div><div class="card"><div class="form-grid"><div class="field full"><label>Market</label><select id="aMarket">${opts}</select></div><div class="field full"><label>Timeframe</label><select id="aTf"><option>15m</option><option>30m</option><option selected>1h</option><option>4h</option><option>1d</option></select></div></div><div class="hr"></div><button class="btn block" onclick="analyzeSelected()">Run SMC Analysis</button><div id="analysisOut"></div></div><div class="warning">Engine: BOS, CHoCH, liquidity sweeps, EMA20/50, RSI14, ATR14, volume expansion, recent-range location and A/B/C signal grading. Signals are heuristic decision support, not guaranteed outcomes.</div>`;}
async function analyzeSelected(){let [v,s]=$('#aMarket').value.split('|'),tf=$('#aTf').value;$('#analysisOut').innerHTML='<div class="hr"></div><div class="subtle">Analyzing...</div>';let rows=await candles(v,s,tf,140),sig=analyzeRows(rows);analysisCache[`${v}|${s}|${tf}`]=sig;$('#analysisOut').innerHTML=signalHTML(sig,v,s,tf)+`<div class="hr"></div><button class="btn block" onclick="prefillFromSignal('${v}','${s}','${tf}')">Use Signal in Planner</button>`;}
function renderPlanner(){let opts=state.symbols.map(s=>`<option value="${s.venue}|${s.symbol}">${VENUE_LABEL[s.venue]} · ${s.label}</option>`).join('');$('#view').innerHTML=`<div class="section-title"><h2>Trade Planner</h2></div><div class="card"><div class="form-grid"><div class="field full"><label>Market</label><select id="pMarket">${opts}</select></div><div class="field"><label>Entry</label><input id="pEntry" type="number" step="any"></div><div class="field"><label>Stop / Invalidation</label><input id="pStop" type="number" step="any"></div><div class="field"><label>Target 1</label><input id="pTp1" type="number" step="any"></div><div class="field"><label>Target 2</label><input id="pTp2" type="number" step="any"></div><div class="field"><label>Risk %</label><input id="pRisk" type="number" step="0.1" value="${state.settings.riskPct}"></div><div class="field"><label>Signal Grade</label><select id="pGrade"><option>A</option><option>B</option><option selected>C</option></select></div><div class="field full"><label>Setup</label><select id="pSetup"><option>Liquidity Sweep + CHoCH</option><option>BOS + Retest</option><option>Demand / Supply Reaction</option><option>Breakout + Retest</option><option>Manual</option></select></div></div><div class="hr"></div><button class="btn block" onclick="calcPlan()">Calculate Position</button><div id="planOut"></div></div>`;}
function prefillPlanner(v,s){closeModal();tab='planner';render();$('#pMarket').value=`${v}|${s}`;let p=prices[s]?.price||0;if(p)$('#pEntry').value=p;}
function prefillFromSignal(v,s,tf){let sig=analysisCache[`${v}|${s}|${tf}`];if(!sig)return;tab='planner';render();$('#pMarket').value=`${v}|${s}`;$('#pEntry').value=sig.price||'';$('#pStop').value=sig.stop||'';$('#pTp1').value=sig.tp1||'';$('#pTp2').value=sig.tp2||'';$('#pGrade').value=sig.grade;$('#pSetup').value=sig.sweep!=='NONE'?'Liquidity Sweep + CHoCH':sig.bos!=='NONE'?'BOS + Retest':'Manual';}
function calcPlan(){let entry=+$(`#pEntry`).value,stop=+$(`#pStop`).value,tp1=+$(`#pTp1`).value,tp2=+$(`#pTp2`).value,risk=+$(`#pRisk`).value||1;if(!entry||!stop||entry===stop){toast('Enter a valid entry and stop');return;}let riskCash=state.settings.capital*risk/100,unitRisk=Math.abs(entry-stop),qty=riskCash/unitRisk,rr1=tp1?Math.abs(tp1-entry)/unitRisk:0,rr2=tp2?Math.abs(tp2-entry)/unitRisk:0,notional=qty*entry;$('#planOut').innerHTML=`<div class="hr"></div><div class="signal-box"><div class="label">Suggested Position Size</div><div class="metric">${fmt(qty,6)}</div><table class="mini-table"><tr><td>Risk amount</td><td>${fmt(riskCash,0)}</td></tr><tr><td>Notional</td><td>${fmt(notional,0)}</td></tr><tr><td>R:R to TP1</td><td>${fmt(rr1,2)}</td></tr><tr><td>R:R to TP2</td><td>${fmt(rr2,2)}</td></tr></table><button class="btn block" style="margin-top:10px" onclick="savePlannedTrade(${qty})">Save to Journal</button></div>`;}
function savePlannedTrade(qty){let [venue,symbol]=$('#pMarket').value.split('|');state.journal.unshift({id:crypto.randomUUID(),created:now(),venue,symbol,side:'LONG',status:'PLANNED',grade:$('#pGrade').value,setup:$('#pSetup').value,entry:+$('#pEntry').value,stop:+$('#pStop').value,tp1:+$('#pTp1').value,tp2:+$('#pTp2').value,plannedQty:qty,notes:'',fills:[]});save();toast('Trade plan saved');}
function renderJournal(){let cards=state.journal.map(t=>{let r=realizedPL(t),pl=r.pl,roi=r.sq&&r.avg?(pl/(r.sq*r.avg))*100:0;return `<div class="card journal-card"><div class="journal-head"><div><div class="symbol">${t.symbol} <span class="pill">${VENUE_LABEL[t.venue]||t.venue}</span></div><div class="venue">${new Date(t.created).toLocaleString()} · ${t.status} · Grade ${t.grade||'-'}</div></div><div class="price ${pl>=0?'pos':'neg'}">${fmt(pl,0)}<div class="venue">Realized P/L</div></div></div><div class="hr"></div><table class="mini-table"><tr><td>Plan Entry</td><td>${fmt(t.entry,4)}</td></tr><tr><td>Stop</td><td>${fmt(t.stop,4)}</td></tr><tr><td>TP1 / TP2</td><td>${fmt(t.tp1,4)} / ${fmt(t.tp2,4)}</td></tr><tr><td>Avg Entry</td><td>${fmt(r.avg,4)}</td></tr><tr><td>Open Qty</td><td>${fmt(r.open,6)}</td></tr><tr><td>Realized ROI</td><td>${fmt(roi,2)}%</td></tr></table><div class="journal-actions"><button class="btn secondary" onclick="editTrade('${t.id}')">Edit</button><button class="btn" onclick="fillsModal('${t.id}')">Fills</button></div></div>`}).join('');$('#view').innerHTML=`<div class="section-title"><h2>Trade Journal</h2><button onclick="newTradeModal()">+ Trade</button></div>${cards||'<div class="card"><div class="subtle">No trades yet.</div></div>'}`;}
function newTradeModal(){modal(`<h2>New Trade</h2>${tradeForm({venue:'NX',symbol:'USDTIRT',side:'LONG',status:'PLANNED',grade:'B',entry:0,stop:0,tp1:0,tp2:0,setup:'Manual',notes:''})}<button class="btn block" onclick="createTrade()">Create</button>`);}
function tradeForm(t){return `<div class="form-grid"><div class="field"><label>Venue</label><select id="eVenue"><option ${t.venue==='TX'?'selected':''}>TX</option><option ${t.venue==='NX'?'selected':''}>NX</option><option ${t.venue==='DX'?'selected':''}>DX</option></select></div><div class="field"><label>Symbol</label><input id="eSymbol" value="${t.symbol||''}"></div><div class="field"><label>Status</label><select id="eStatus">${['PLANNED','OPEN','PARTIAL','CLOSED','CANCELLED'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Grade</label><select id="eGrade">${['A','B','C','MANUAL'].map(x=>`<option ${t.grade===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Plan Entry</label><input id="eEntry" type="number" step="any" value="${t.entry||0}"></div><div class="field"><label>Stop</label><input id="eStop" type="number" step="any" value="${t.stop||0}"></div><div class="field"><label>TP1</label><input id="eTp1" type="number" step="any" value="${t.tp1||0}"></div><div class="field"><label>TP2</label><input id="eTp2" type="number" step="any" value="${t.tp2||0}"></div><div class="field full"><label>Setup</label><input id="eSetup" value="${t.setup||''}"></div><div class="field full"><label>Notes</label><textarea id="eNotes">${t.notes||''}</textarea></div></div><div class="hr"></div>`;}
function createTrade(){state.journal.unshift({id:crypto.randomUUID(),created:now(),venue:$('#eVenue').value,symbol:$('#eSymbol').value.toUpperCase(),side:'LONG',status:$('#eStatus').value,grade:$('#eGrade').value,entry:+$('#eEntry').value,stop:+$('#eStop').value,tp1:+$('#eTp1').value,tp2:+$('#eTp2').value,setup:$('#eSetup').value,notes:$('#eNotes').value,fills:[]});save();closeModal();render();}
function editTrade(id){let t=state.journal.find(x=>x.id===id);modal(`<h2>Edit Trade</h2>${tradeForm(t)}<div class="row"><button class="btn danger" onclick="deleteTrade('${id}')">Delete</button><button class="btn" style="flex:1" onclick="updateTrade('${id}')">Save Changes</button></div>`);}
function updateTrade(id){let t=state.journal.find(x=>x.id===id);Object.assign(t,{venue:$('#eVenue').value,symbol:$('#eSymbol').value.toUpperCase(),status:$('#eStatus').value,grade:$('#eGrade').value,entry:+$('#eEntry').value,stop:+$('#eStop').value,tp1:+$('#eTp1').value,tp2:+$('#eTp2').value,setup:$('#eSetup').value,notes:$('#eNotes').value});save();closeModal();render();}
function deleteTrade(id){state.journal=state.journal.filter(x=>x.id!==id);save();closeModal();render();}
function fillsModal(id){let t=state.journal.find(x=>x.id===id);let rows=(t.fills||[]).map((f,i)=>`<div class="market-row"><div><strong>${f.type}</strong><div class="venue">${new Date(f.time).toLocaleString()}</div></div><div class="price">${fmt(f.qty,6)} @ ${fmt(f.price,4)}<div><button class="btn secondary" onclick="editFill('${id}',${i})">Edit</button></div></div></div>`).join('');modal(`<h2>Trade Fills · ${t.symbol}</h2>${rows||'<div class="subtle">No fills yet.</div>'}<div class="hr"></div><button class="btn block" onclick="addFillModal('${id}')">+ Add Fill</button>`);}
function addFillModal(id,i=null){let t=state.journal.find(x=>x.id===id),f=i===null?{type:'BUY',qty:0,price:0,fee:0,time:now()}:(t.fills[i]);modal(`<h2>${i===null?'Add':'Edit'} Fill</h2><div class="form-grid"><div class="field"><label>Type</label><select id="fType"><option ${f.type==='BUY'?'selected':''}>BUY</option><option ${f.type==='SELL'?'selected':''}>SELL</option></select></div><div class="field"><label>Quantity</label><input id="fQty" type="number" step="any" value="${f.qty}"></div><div class="field"><label>Price</label><input id="fPrice" type="number" step="any" value="${f.price}"></div><div class="field"><label>Fee</label><input id="fFee" type="number" step="any" value="${f.fee||0}"></div></div><div class="hr"></div><button class="btn block" onclick="saveFill('${id}',${i===null?'null':i})">Save Fill</button>${i!==null?`<button class="btn danger block" style="margin-top:8px" onclick="deleteFill('${id}',${i})">Delete Fill</button>`:''}`);}
function editFill(id,i){addFillModal(id,i)}
function saveFill(id,i){let t=state.journal.find(x=>x.id===id),f={type:$('#fType').value,qty:+$('#fQty').value,price:+$('#fPrice').value,fee:+$('#fFee').value,time:now()};t.fills=t.fills||[];if(i===null)t.fills.push(f);else t.fills[i]={...t.fills[i],...f};let r=realizedPL(t);t.status=r.open>0?(r.sq>0?'PARTIAL':'OPEN'):(r.bq>0?'CLOSED':t.status);save();fillsModal(id);}
function deleteFill(id,i){let t=state.journal.find(x=>x.id===id);t.fills.splice(i,1);save();fillsModal(id);}
function renderSettings(){$('#view').innerHTML=`<div class="section-title"><h2>Settings</h2></div><div class="card"><div class="form-grid"><div class="field full"><label>Trading Capital (Toman)</label><input id="sCap" type="number" value="${state.settings.capital}"></div><div class="field"><label>Default Risk %</label><input id="sRisk" type="number" step="0.1" value="${state.settings.riskPct}"></div><div class="field"><label>DX Digital Gold Price</label><input id="sGold" type="number" step="any" value="${state.settings.dxGoldPrice}"></div></div><div class="hr"></div><button class="btn block" onclick="saveSettings()">Save Settings</button></div><div class="section-title"><h2>Security</h2></div><div class="card"><div class="security-grid"><button class="btn secondary" onclick="changePasswordModal()">Change Password</button><button class="btn secondary" onclick="lockNow()">Lock Now</button></div><div class="security-note">The app locks after 10 minutes of inactivity. Password verification stays on this device and is never sent to NX, TX, DX or GitHub.</div></div><div class="section-title"><h2>Privacy</h2></div><div class="card"><div class="warning">No account connection. No private API keys. No balances. No account history. No order placement. NX and TX are used only for public market data. DX price is manual.</div></div><div class="section-title"><h2>Data</h2></div><div class="card"><div class="row wrap"><button class="btn secondary" onclick="exportData()">Export Backup</button><button class="btn secondary" onclick="importData()">Import Backup</button></div><div class="hr"></div><div class="subtle">Journal and settings are stored locally in this browser / installed PWA.</div></div>`;}
function saveSettings(){state.settings.capital=+$(`#sCap`).value;state.settings.riskPct=+$(`#sRisk`).value;state.settings.dxGoldPrice=+$(`#sGold`).value;save();render();toast('Settings saved');}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TAJDARA_MM_backup.json';a.click();URL.revokeObjectURL(a.href);}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{state=JSON.parse(await i.files[0].text());save();render();toast('Backup imported')}catch{toast('Invalid backup')}};i.click();}
$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));$('#refreshAll').addEventListener('click',refreshPrices);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});boot();

</script>
