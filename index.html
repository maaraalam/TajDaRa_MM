  <script>
window.addEventListener('error',function(e){const b=document.getElementById('lockBody');if(b && !document.getElementById('lockAction')){b.innerHTML='<div class="lock-error">Startup error: '+String(e.message||'Unknown error')+'</div><div class="security-note">Refresh once. If this persists, replace the GitHub Pages files with the complete v8 package.</div>';}});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const now=()=>new Date().toISOString();
const uid=()=>globalThis.crypto?.randomUUID?crypto.randomUUID():('t_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
const VENUE_LABEL={TX:'TX',NX:'NX',DX:'DX',BN:'BN'};
const pkey=(v,s)=>v+'|'+s;
const AUTH_KEY='tajdara_mm_auth_v1';
const LOCK_TIMEOUT_MS=10*60*1000;
let appStarted=false,refreshTimer=null,signalTimer=null,newsTimer=null,lockTimer=null,marketChartTimer=null,activeMarketChart=null;
function b64(bytes){return btoa(String.fromCharCode(...bytes));}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function passwordHash(password,salt,iterations=180000){
  if(!globalThis.crypto || !crypto.subtle) throw new Error('Web Crypto unavailable. Open the app from its HTTPS GitHub Pages address.');
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256);
  return b64(new Uint8Array(bits));
}
function authConfig(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{return null}}
function resetLocalLockOnly(){if(confirm('Reset the local app password on this device? Journal and settings will be kept.')){localStorage.removeItem(AUTH_KEY);showLock('setup')}}
function lockMarkup(mode='unlock'){
  const setup=mode==='setup';
  $('#lockBody').innerHTML=`<div class="field"><label>${setup?'Create Password':'Password'}</label><input id="lockPass" type="password" autocomplete="${setup?'new-password':'current-password'}" placeholder="${setup?'Minimum 6 characters':'Enter password'}"></div>${setup?'<div class="field"><label>Confirm Password</label><input id="lockPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>':''}<button id="lockAction" class="btn block">${setup?'Create Password':'Unlock'}</button><div id="lockError" class="lock-error"></div><div class="security-note">Password verification is local to this device. No account connection or password is sent to NX, TX, DX, GitHub or any server.</div><button type="button" class="btn secondary block" style="margin-top:10px" onclick="resetLocalLockOnly()">Reset Local Lock</button>`;
  $('#lockAction').onclick=setup?createLocalPassword:unlockApp;
  $('#lockPass').addEventListener('keydown',e=>{if(e.key==='Enter'&&!setup)unlockApp()});
  setTimeout(()=>$('#lockPass')?.focus(),100);
}
function showLock(mode='unlock'){$('#lockScreen').classList.remove('hidden');lockMarkup(mode)}
function hideLock(){$('#lockScreen').classList.add('hidden')}
async function createLocalPassword(){
  const p=$('#lockPass').value,p2=$('#lockPass2').value,err=$('#lockError');
  if(p.length<6){err.textContent='Use at least 6 characters.';return}
  if(p!==p2){err.textContent='Passwords do not match.';return}
  try{const salt=crypto.getRandomValues(new Uint8Array(16));const iterations=180000;const hash=await passwordHash(p,salt,iterations);localStorage.setItem(AUTH_KEY,JSON.stringify({salt:b64(salt),hash,iterations,createdAt:Date.now()}));hideLock();startApp();toast('Password created');}catch(e){err.textContent=e?.message||'Could not create password on this device.'}
}
async function verifyPassword(p){const a=authConfig();if(!a)return false;const h=await passwordHash(p,unb64(a.salt),a.iterations||180000);return h===a.hash}
async function unlockApp(){const p=$('#lockPass').value,err=$('#lockError');err.textContent='Checking…';try{if(await verifyPassword(p)){err.textContent='';hideLock();startApp();resetLockTimer()}else err.textContent='Incorrect password.'}catch(e){err.textContent=e?.message||'Could not verify password.'}}
function lockNow(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}if(signalTimer){clearInterval(signalTimer);signalTimer=null}if(newsTimer){clearInterval(newsTimer);newsTimer=null}showLock('unlock')}
function resetLockTimer(){if($('#lockScreen')&&!$('#lockScreen').classList.contains('hidden'))return;clearTimeout(lockTimer);lockTimer=setTimeout(lockNow,LOCK_TIMEOUT_MS)}

function tfToTX(tf){return {'15m':'15m','30m':'30m','1h':'1h','4h':'4h','1d':'1d'}[tf]||'1h'}
function tfToNX(tf){return {'15m':15,'30m':30,'1h':60,'4h':240,'1d':'D'}[tf]||60}
function tfMs(tf){return {'15m':900000,'30m':1800000,'1h':3600000,'4h':14400000,'1d':86400000}[tf]||3600000}
async function candles(v,s,tf='1h',limit=120){try{if(v==='TX'){let endTime=Date.now(),startTime=endTime-limit*tfMs(tf);let r=await fetch(`https://api.toobit.com/quote/v1/klines?symbol=${encodeURIComponent(s)}&interval=${tfToTX(tf)}&startTime=${startTime}&endTime=${endTime}&limit=${limit}`),d=await r.json();if(d?.data)d=d.data;return (Array.isArray(d)?d:[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+(x[5]||0)}));}if(v==='BN'){let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${encodeURIComponent(s)}&interval=${tfToTX(tf)}&limit=${limit}`),d=await r.json();return (Array.isArray(d)?d:[]).map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+(x[5]||0)}));}if(v==='DX'){let h=(state.dxHistory||[]).filter(x=>x.price>0);if(!h.length&&state.settings.dxGoldPrice>0)h=[{t:Date.now(),price:+state.settings.dxGoldPrice}];return h.slice(-limit).map(x=>({t:+x.t,o:+x.price,h:+x.price,l:+x.price,c:+x.price,v:0}));}if(v==='NX'){let mult={'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400}[tf]||3600,to=Math.floor(Date.now()/1000),from=to-limit*mult;let r=await fetch(`https://apiv2.nobitex.ir/market/udf/history?symbol=${s}&resolution=${tfToNX(tf)}&from=${from}&to=${to}`),d=await r.json(),f=s.endsWith('IRT')?10:1;return (d.t||[]).map((_,i)=>({t:+d.t[i]*1000,o:+d.o[i]/f,h:+d.h[i]/f,l:+d.l[i]/f,c:+d.c[i]/f,v:+(d.v?.[i]||0)}));}}catch(e){}return[];}
function ema(vals,n){if(!vals.length)return 0;let k=2/(n+1),e=vals[0];for(let i=1;i<vals.length;i++)e=vals[i]*k+e*(1-k);return e;}
function rsi(vals,n=14){if(vals.length<n+1)return 50;let g=0,l=0;for(let i=vals.length-n;i<vals.length;i++){let d=vals[i]-vals[i-1];if(d>0)g+=d;else l-=d;}g/=n;l/=n;if(!l)return 100;return 100-100/(1+g/l);}
function atr(rows,n=14){if(rows.length<2)return 0;let trs=[];for(let i=1;i<rows.length;i++){let x=rows[i],pc=rows[i-1].c;trs.push(Math.max(x.h-x.l,Math.abs(x.h-pc),Math.abs(x.l-pc)));}return trs.slice(-n).reduce((a,b)=>a+b,0)/Math.min(n,trs.length);}
function pivots(rows,left=2,right=2){let hs=[],ls=[];for(let i=left;i<rows.length-right;i++){let h=rows[i].h,l=rows[i].l;if(rows.slice(i-left,i).every(x=>h>x.h)&&rows.slice(i+1,i+right+1).every(x=>h>=x.h))hs.push([i,h]);if(rows.slice(i-left,i).every(x=>l<x.l)&&rows.slice(i+1,i+right+1).every(x=>l<=x.l))ls.push([i,l]);}return [hs,ls];}
function analyzeRows(rows){let out={side:'WAIT',grade:'C',score:0,trend:'RANGE',bos:'NONE',choch:'NONE',sweep:'NONE',ema20:0,ema50:0,rsi14:50,atr14:0,price:0,entryLow:0,entryHigh:0,stop:0,tp1:0,tp2:0,rr1:0,rr2:0,reasons:[]};if(rows.length<60){out.reasons=['Need at least 60 candles'];return out;}let c=rows.map(x=>x.c),vol=rows.map(x=>x.v||0),last=rows.at(-1);out.price=last.c;out.ema20=ema(c.slice(-80),20);out.ema50=ema(c.slice(-120),50);out.rsi14=rsi(c);out.atr14=atr(rows);let score=0;if(out.price>out.ema20&&out.ema20>out.ema50){out.trend='UP';score+=2;out.reasons.push('Price > EMA20 > EMA50');}else if(out.price<out.ema20&&out.ema20<out.ema50){out.trend='DOWN';score-=2;out.reasons.push('Price < EMA20 < EMA50');}else out.reasons.push('Mixed EMA structure');let [hs,ls]=pivots(rows),prevH=hs.length?hs.at(-1)[1]:Math.max(...rows.slice(-20,-1).map(x=>x.h)),prevL=ls.length?ls.at(-1)[1]:Math.min(...rows.slice(-20,-1).map(x=>x.l));if(out.price>prevH){out.bos='BULLISH';score+=2;out.reasons.push('Bullish BOS');if(out.trend==='DOWN'){out.choch='BULLISH';score++;out.reasons.push('Bullish CHoCH');}}else if(out.price<prevL){out.bos='BEARISH';score-=2;out.reasons.push('Bearish BOS');if(out.trend==='UP'){out.choch='BEARISH';score--;out.reasons.push('Bearish CHoCH');}}if(last.l<prevL&&out.price>prevL){out.sweep='SELL-SIDE';score+=2;out.reasons.push('Sell-side liquidity sweep + reclaim');}else if(last.h>prevH&&out.price<prevH){out.sweep='BUY-SIDE';score-=2;out.reasons.push('Buy-side liquidity sweep + rejection');}if(out.rsi14<32){score++;out.reasons.push('RSI oversold');}else if(out.rsi14>68){score--;out.reasons.push('RSI overbought');}else out.reasons.push('RSI neutral');let av=vol.slice(-21,-1).filter(Boolean);let avgVol=av.length?av.reduce((a,b)=>a+b,0)/av.length:0;if(avgVol&&last.v>avgVol*1.35){if(last.c>last.o){score++;out.reasons.push('Bullish volume expansion');}else{score--;out.reasons.push('Bearish volume expansion');}}let rhi=Math.max(...rows.slice(-30).map(x=>x.h)),rlo=Math.min(...rows.slice(-30).map(x=>x.l)),span=Math.max(rhi-rlo,1e-12),loc=(out.price-rlo)/span;if(loc<.28){score++;out.reasons.push('Price near lower recent range');}else if(loc>.72){score--;out.reasons.push('Price near upper recent range');}let a=Math.max(out.atr14,out.price*.001);if(score>=2){out.side='LONG';out.entryLow=out.price-a*.35;out.entryHigh=out.price+a*.08;out.stop=out.price-a*1.25;let risk=out.price-out.stop;out.tp1=out.price+risk*1.7;out.tp2=out.price+risk*2.8;}else if(score<=-2){out.side='SHORT';out.entryLow=out.price-a*.08;out.entryHigh=out.price+a*.35;out.stop=out.price+a*1.25;let risk=out.stop-out.price;out.tp1=out.price-risk*1.7;out.tp2=out.price-risk*2.8;}if(out.side!=='WAIT'){let risk=Math.abs(out.price-out.stop);out.rr1=Math.abs(out.tp1-out.price)/risk;out.rr2=Math.abs(out.tp2-out.price)/risk;}let confirms=[out.bos!=='NONE',out.choch!=='NONE',out.sweep!=='NONE',avgVol&&last.v>avgVol*1.35].filter(Boolean).length,abs=Math.abs(score);out.grade=out.side!=='WAIT'&&abs>=5&&confirms>=2&&out.rr2>=2.5?'A':out.side!=='WAIT'&&abs>=3&&out.rr1>=1.5?'B':'C';out.score=score;return out;}

function emaSeries(rows,n){let out=[],k=2/(n+1),e=null;for(const x of rows){e=e===null?x.c:(x.c*k+e*(1-k));out.push({time:Math.floor(x.t/1000),value:e});}return out;}
function smcHistory(rows){
  const markers=[]; let trend='NONE'; const [hs,ls]=pivots(rows,2,2); let hiPtr=0,loPtr=0,lastH=null,lastL=null;
  for(let i=0;i<rows.length;i++){
    while(hiPtr<hs.length && hs[hiPtr][0]<i){lastH=hs[hiPtr];hiPtr++;}
    while(loPtr<ls.length && ls[loPtr][0]<i){lastL=ls[loPtr];loPtr++;}
    const x=rows[i],t=Math.floor(x.t/1000);
    if(lastH && x.c>lastH[1]){const choch=trend==='DOWN';markers.push({time:t,position:'belowBar',color:choch?'#d8c57d':'#8fd39a',shape:'arrowUp',text:choch?'CHoCH ↑':'BOS ↑'});trend='UP';lastH=null;}
    else if(lastH && x.h>lastH[1] && x.c<lastH[1]){markers.push({time:t,position:'aboveBar',color:'#d9b36c',shape:'circle',text:'BSL SWEEP'});lastH=null;}
    if(lastL && x.c<lastL[1]){const choch=trend==='UP';markers.push({time:t,position:'aboveBar',color:choch?'#d8c57d':'#e49090',shape:'arrowDown',text:choch?'CHoCH ↓':'BOS ↓'});trend='DOWN';lastL=null;}
    else if(lastL && x.l<lastL[1] && x.c>lastL[1]){markers.push({time:t,position:'belowBar',color:'#b6d69c',shape:'circle',text:'SSL SWEEP'});lastL=null;}
  }
  return markers.slice(-40);
}
function nearestBarTime(rows,iso){let target=+new Date(iso||0);if(!target||!rows.length)return null;let best=rows[0],d=Math.abs(rows[0].t-target);for(const r of rows){let nd=Math.abs(r.t-target);if(nd<d){d=nd;best=r}}return Math.floor(best.t/1000);}
function tradeMarkers(v,s,rows){let ms=[];for(const t of state.journal.filter(x=>x.venue===v&&x.symbol===s)){for(const f of (t.fills||[])){let tm=nearestBarTime(rows,f.time);if(!tm)continue;ms.push({time:tm,position:f.type==='BUY'?'belowBar':'aboveBar',color:f.type==='BUY'?'#7fc88a':'#e58c8c',shape:f.type==='BUY'?'arrowUp':'arrowDown',text:`${f.type} ${fmt(f.price,4)}`});}}return ms;}
function lastSwingLines(rows){const [hs,ls]=pivots(rows,2,2), out=[];if(hs.length>=2)out.push({kind:'high',pts:hs.slice(-2)});if(ls.length>=2)out.push({kind:'low',pts:ls.slice(-2)});return out;}

function drawLiveChart(rows,v,s){
  const el=$('#liveChart'); if(!el)return; el.innerHTML='';
  if(!rows.length){el.innerHTML='<div style="padding:55px 24px;color:#9eafa5">Chart unavailable for this market.</div>';return;}
  if(v==='DX' && rows.length<2){el.innerHTML=`<div style="padding:45px 24px;color:#9eafa5">DX needs at least two saved price snapshots to draw a chart.<br><strong style="color:#d7e8cf;font-size:22px">${fmt(rows[0]?.c||state.settings.dxGoldPrice,2)}</strong></div>`;return;}
  if(!globalThis.LightweightCharts){el.innerHTML='<div style="padding:55px 24px;color:#e1b47b">Chart library did not load. Check internet access and refresh.</div>';return;}
  const chart=LightweightCharts.createChart(el,{width:el.clientWidth||760,height:el.clientHeight||520,layout:{background:{color:'#0e1611'},textColor:'#aebfb1'},grid:{vertLines:{color:'#1c2a20'},horzLines:{color:'#1c2a20'}},rightPriceScale:{borderColor:'#314438'},timeScale:{borderColor:'#314438',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:true,handleScale:true});

  const e20=chart.addLineSeries({color:'#d3dda2',lineWidth:1,priceLineVisible:false,lastValueVisible:false});e20.setData(emaSeries(rows,20));
  const e50=chart.addLineSeries({color:'#75a77b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});e50.setData(emaSeries(rows,50));
  let markers=[...smcHistory(rows),...tradeMarkers(v,s,rows)].sort((a,b)=>a.time-b.time);try{candlesSeries.setMarkers(markers)}catch(e){}
  for(const ln of lastSwingLines(rows)){const ser=chart.addLineSeries({color:ln.kind==='high'?'#d9a66c':'#7fa98b',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});ser.setData(ln.pts.map(([i,p])=>({time:Math.floor(rows[i].t/1000),value:p})));}
  const open=state.journal.filter(t=>t.venue===v&&t.symbol===s&&realizedPL(t).open>0);for(const t of open){let r=realizedPL(t);if(r.avg)candlesSeries.createPriceLine({price:r.avg,color:'#9fd397',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'AVG'});if(t.stop)candlesSeries.createPriceLine({price:+t.stop,color:'#e58c8c',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'STOP'});if(t.tp1)candlesSeries.createPriceLine({price:+t.tp1,color:'#d9c877',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'TP1'});if(t.tp2)candlesSeries.createPriceLine({price:+t.tp2,color:'#b4d79c',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'TP2'});}

}

function currentTelegramConfig(){
  // When Settings is open, use the values currently typed by the user even before Save Settings is pressed.
  const workerInput=$('#sTgWorker'),keyInput=$('#sTgKey');
  const url=(workerInput?workerInput.value:state.settings.telegramWorkerUrl||'').trim().replace(/\/$/,'');
  const key=(keyInput?keyInput.value:state.settings.telegramPairingKey||'').trim();
  return {url,key};
}
async function parseWorkerResponse(r){
  let text='';try{text=await r.text()}catch(e){}
  let data=null;try{data=text?JSON.parse(text):null}catch(e){}
  return {ok:r.ok,status:r.status,text,data};
}
function workerErrorMessage(res){
  if(!res)return 'No response from Worker';
  if(res.status===401)return '401 · Invalid Pairing Key. APP_SHARED_KEY and Pairing Key must match exactly.';
  if(res.status===404)return '404 · Worker endpoint not found. Deploy the v8.1 worker.js file.';
  if(res.status===500)return '500 · Worker/Telegram error: '+(res.data?.error||res.text||'Check Worker secrets.');
  return `${res.status} · ${res.data?.error||res.text||'Worker request failed'}`;
}
async function workerPost(path,payload={}){
  const {url,key}=currentTelegramConfig();
  if(!url)throw new Error('Cloudflare Worker URL is required.');
  if(!key)throw new Error('Pairing Key is required.');
  const r=await fetch(url+path,{method:'POST',headers:{'Content-Type':'application/json','X-TAJDARA-Key':key},body:JSON.stringify(payload)});
  return parseWorkerResponse(r);
}
async function sendTelegramRelay(title,body){
  try{const res=await workerPost('/signal',{title,body,time:now()});return res.ok}catch(e){return false}
}
function notifySignal(title,body){toast(title+' · '+body);if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}let u=(state.settings.webhookUrl||'').trim();if(u){fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:'TAJDARA M&M',title,body,time:now()})}).catch(()=>{});}sendTelegramRelay(title,body);}
async function syncTelegramState(showToast=false){
  try{
    const payload={watches:state.watches||[],journal:state.journal||[],dxHistory:state.dxHistory||[],settings:{dxGoldPrice:state.settings.dxGoldPrice,newsAlerts:state.settings.newsAlerts!==false}};
    const res=await workerPost('/sync',payload);
    if(showToast)toast(res.ok?`24/7 monitor synced · ${res.data?.watches??(state.watches||[]).length} watch(es)`:workerErrorMessage(res));
    setTelegramStatus(res.ok?'CONNECTED':'ERROR',res.ok?`Worker connected · ${(state.watches||[]).length} watch(es) ready`:workerErrorMessage(res));
    return res.ok;
  }catch(e){if(showToast)toast(e.message||'Telegram sync failed');setTelegramStatus('ERROR',e.message||'Telegram sync failed');return false}
}
function setTelegramStatus(kind,message){
  const el=$('#tgStatus');if(!el)return;
  const cls=kind==='CONNECTED'?'pos':kind==='TESTING'?'amber':'neg';
  el.innerHTML=`<span class="${cls}">${kind}</span><div class="subtle" style="margin-top:4px">${escapeHtml(message||'')}</div>`;
}
async function testTelegram(){
  // Persist whatever is currently typed so the test cannot accidentally use stale saved values.
  const {url,key}=currentTelegramConfig();
  if(!url||!key){const msg=!url?'Cloudflare Worker URL is required.':'Pairing Key is required.';toast(msg);setTelegramStatus('ERROR',msg);return}
  state.settings.telegramWorkerUrl=url;state.settings.telegramPairingKey=key;save();
  setTelegramStatus('TESTING','Checking Worker authentication and Telegram delivery…');
  try{
    const res=await workerPost('/test',{source:'TAJDARA M&M Universal v9',time:now()});
    if(res.ok){toast('Telegram test sent successfully');setTelegramStatus('CONNECTED','Telegram test delivered successfully to the shared group.');}
    else{const msg=workerErrorMessage(res);toast(msg);setTelegramStatus('ERROR',msg);}
  }catch(e){const msg=e?.message||'Network/CORS error while contacting Worker.';toast(msg);setTelegramStatus('ERROR',msg);}
}
async function testWorkerConnection(){
  const {url}=currentTelegramConfig();if(!url){toast('Cloudflare Worker URL is required.');return}
  setTelegramStatus('TESTING','Checking /health…');
  try{const r=await fetch(url+'/health',{cache:'no-store'}),res=await parseWorkerResponse(r);if(res.ok){setTelegramStatus('CONNECTED',res.data?.service||'Worker health check passed.');toast('Worker health check passed');}else{const msg=workerErrorMessage(res);setTelegramStatus('ERROR',msg);toast(msg)}}catch(e){const msg=e?.message||'Worker is unreachable.';setTelegramStatus('ERROR',msg);toast(msg)}
}

async function requestNotify(){if(!('Notification' in window)){toast('Browser notifications are not supported here');return}let p=await Notification.requestPermission();toast('Notification permission: '+p)}
function renderAlerts(){let opts=state.symbols.filter(x=>x.venue!=='DX'||state.dxHistory?.length).map(s=>`<option value="${s.venue}|${s.symbol}">${VENUE_LABEL[s.venue]} · ${s.label}</option>`).join('');let cards=(state.watches||[]).map(w=>`<div class="card"><div class="journal-head"><div><div class="symbol">${w.symbol} <span class="pill">${w.venue}</span></div><div class="venue">${w.timeframe} · ${w.types.join(' / ')}</div></div><div class="${w.enabled?'pos':'amber'}">${w.enabled?'WATCHING':'PAUSED'}</div></div><div class="hr"></div><div class="reason">Last: ${w.lastMessage||'Waiting for a qualified signal.'}</div><div class="journal-actions"><button class="btn secondary" onclick="toggleWatch('${w.id}')">${w.enabled?'Pause':'Resume'}</button><button class="btn danger" onclick="deleteWatch('${w.id}')">Delete</button></div></div>`).join('');$('#view').innerHTML=`<div class="section-title"><h2>Signal Watch</h2><button onclick="requestNotify()">Enable Notifications</button></div><div class="card"><div class="form-grid"><div class="field full"><label>Market</label><select id="wMarket">${opts}</select></div><div class="field"><label>Timeframe</label><select id="wTf"><option>15m</option><option>30m</option><option selected>1h</option><option>4h</option><option>1d</option></select></div><div class="field"><label>Minimum Grade</label><select id="wGrade"><option>A</option><option selected>B</option></select></div><div class="field full"><label>Signal Types</label><div class="row wrap"><label><input type="checkbox" id="wBuy" checked> BUY</label><label><input type="checkbox" id="wTake" checked> TAKE PROFIT</label><label><input type="checkbox" id="wExit" checked> EXIT / SELL</label></div></div></div><div class="hr"></div><button class="btn block" onclick="addWatch()">Start Waiting for Signal</button></div><div class="warning">The app checks every 60 seconds while open. For 24/7 shared Telegram alerts, deploy the included Cloudflare Worker, add its URL and Pairing Key in Settings, then Sync 24/7 Signal Watches.</div><div class="section-title"><h2>Active Watches</h2></div>${cards||'<div class="card"><div class="subtle">No signal watches yet.</div></div>'}`;}
function addWatch(){let [venue,symbol]=$('#wMarket').value.split('|'),types=[];if($('#wBuy').checked)types.push('BUY');if($('#wTake').checked)types.push('TAKE PROFIT');if($('#wExit').checked)types.push('EXIT');if(!types.length){toast('Choose at least one signal type');return}state.watches=state.watches||[];state.watches.unshift({id:uid(),venue,symbol,timeframe:$('#wTf').value,minGrade:$('#wGrade').value,types,enabled:true,lastKey:'',lastMessage:'',created:now()});save();render();checkSignalWatches();syncTelegramState();}
function toggleWatch(id){let w=state.watches.find(x=>x.id===id);if(w)w.enabled=!w.enabled;save();render();syncTelegramState();}
function deleteWatch(id){state.watches=state.watches.filter(x=>x.id!==id);save();render();syncTelegramState();}
function gradeOk(sig,min){return min==='A'?sig.grade==='A':['A','B'].includes(sig.grade)}
async function checkSignalWatches(){if(!appStarted)return;for(const w of (state.watches||[]).filter(x=>x.enabled)){try{let rows=await candles(w.venue,w.symbol,w.timeframe,140);let sig=analyzeRows(rows);if(!rows.length)continue;let p=sig.price||rows.at(-1).c,msg='',kind='';if(w.types.includes('BUY')&&sig.side==='LONG'&&gradeOk(sig,w.minGrade)){kind='BUY';msg=`${w.symbol} ${w.timeframe} Grade ${sig.grade}: entry ${fmt(sig.entryLow,4)}-${fmt(sig.entryHigh,4)}, stop ${fmt(sig.stop,4)}, TP1 ${fmt(sig.tp1,4)}, TP2 ${fmt(sig.tp2,4)}`;}let openTrades=state.journal.filter(t=>t.symbol===w.symbol&&t.venue===w.venue&&realizedPL(t).open>0);if(!kind&&w.types.includes('TAKE PROFIT')){for(const t of openTrades){if((t.tp2&&p>=t.tp2)||(t.tp1&&p>=t.tp1)){kind='TAKE PROFIT';msg=`${w.symbol} reached a planned profit level at ${fmt(p,4)}. Review partial/full profit taking.`;break}}}if(!kind&&w.types.includes('EXIT')){for(const t of openTrades){if((t.stop&&p<=t.stop)||(sig.side==='SHORT'&&gradeOk(sig,w.minGrade))){kind='EXIT';msg=`${w.symbol} exit condition at ${fmt(p,4)}. ${t.stop&&p<=t.stop?'Invalidation/stop reached.':'Bearish signal Grade '+sig.grade+'.'}`;break}}}if(!kind&&w.types.includes('EXIT')&&sig.side==='SHORT'&&gradeOk(sig,w.minGrade)){kind='SELL';msg=`${w.symbol} ${w.timeframe} bearish Grade ${sig.grade}: entry ${fmt(sig.entryLow,4)}-${fmt(sig.entryHigh,4)}, stop ${fmt(sig.stop,4)}, TP1 ${fmt(sig.tp1,4)}`;}let key=kind?kind+'|'+Math.round(p*10000)/10000+'|'+sig.grade:'';w.lastMessage=kind?msg:`No qualified signal. Price ${fmt(p,4)} · ${sig.side} · Grade ${sig.grade}`;if(kind&&key!==w.lastKey){w.lastKey=key;notifySignal(kind+' SIGNAL · '+w.symbol,msg);}save();if(tab==='alerts')render();}catch(e){w.lastMessage='Check failed: '+(e?.message||'market data unavailable');save();}}}

let newsCache=[];
function escapeHtml(x=''){return String(x).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));}
async function fetchMarketNews(force=false){
  let u=(state.settings.telegramWorkerUrl||'').trim(),k=(state.settings.telegramPairingKey||'').trim();
  if(!u)throw new Error('Configure the Cloudflare Worker URL in Settings to load Market News.');
  let r=await fetch(u.replace(/\/$/,'')+'/news'+(force?'?refresh=1':''),{headers:k?{'X-TAJDARA-Key':k}:{}});
  if(!r.ok)throw new Error('News service unavailable');
  let d=await r.json();newsCache=d.items||[];return newsCache;
}
function newsItemHTML(n){let imp=(n.impact||'LOW').toUpperCase(),cls=imp==='HIGH'?'impact-high':imp==='MEDIUM'?'impact-medium':'impact-low';let dt=n.published?new Date(n.published).toLocaleString():'—';return `<a class="news-card" href="${escapeHtml(n.link||'#')}" target="_blank" rel="noopener"><div class="news-top"><span class="pill ${cls}">${imp} IMPACT</span><span class="pill">${escapeHtml(n.category||'MARKET')}</span><span class="venue">${escapeHtml(n.source||'News')}</span></div><div class="news-title">${escapeHtml(n.title||'Untitled')}</div>${n.summary?`<div class="news-summary">${escapeHtml(n.summary)}</div>`:''}<div class="news-meta">${dt}${n.reason?' · '+escapeHtml(n.reason):''}</div></a>`;}
async function renderNews(){
  $('#view').innerHTML=`<div class="section-title"><h2>Market Moving News</h2><div class="news-controls"><button class="btn secondary" onclick="loadNews(true)">Refresh</button></div></div><div class="card"><div class="row wrap"><span class="pill">Fed / Rates</span><span class="pill">Inflation / Jobs</span><span class="pill">Geopolitics</span><span class="pill">Gold / Oil</span><span class="pill">Bitcoin / Crypto</span><span class="pill">Iran FX</span></div><div class="security-note">High-impact headlines can also be sent to the shared Telegram group when News Alerts are enabled and the 24/7 Worker is configured.</div></div><div id="newsList"><div class="card news-empty">Loading market-moving news…</div></div>`;
  loadNews(false);
}
async function loadNews(force=false){let el=$('#newsList');if(!el)return;try{let items=await fetchMarketNews(force);el.innerHTML=items.length?items.map(newsItemHTML).join(''):'<div class="card news-empty">No fresh high-impact items found.</div>';}catch(e){el.innerHTML=`<div class="card"><div class="warning">${escapeHtml(e.message||'Could not load news.')}</div></div>`;}}
async function checkNewsAlerts(){if(!appStarted||state.settings.newsAlerts===false||!(state.settings.telegramWorkerUrl||'').trim())return;try{let items=await fetchMarketNews(false);state.newsSeen=state.newsSeen||[];let seen=new Set(state.newsSeen);let fresh=items.filter(n=>n.impact==='HIGH'&&!seen.has(n.title)).slice(0,3);for(const n of fresh){toast('MARKET NEWS · '+n.category+' · '+n.title);if('Notification' in window&&Notification.permission==='granted'){try{new Notification('MARKET NEWS · '+n.category,{body:n.title})}catch(e){}}seen.add(n.title);}state.newsSeen=[...seen].slice(-100);save();}catch(e){}}

function renderSettings(){$('#view').innerHTML=`<div class="section-title"><h2>Settings</h2></div><div class="card"><div class="form-grid"><div class="field full"><label>Trading Capital (Toman)</label><input id="sCap" type="number" value="${state.settings.capital}"></div><div class="field"><label>Default Risk %</label><input id="sRisk" type="number" step="0.1" value="${state.settings.riskPct}"></div><div class="field"><label>DX Digital Gold Price</label><input id="sGold" type="number" step="any" value="${state.settings.dxGoldPrice}"></div><div class="field full"><label>Optional General Webhook URL</label><input id="sWebhook" value="${state.settings.webhookUrl||''}" placeholder="Make / Zapier / custom endpoint"></div></div><div class="hr"></div><button class="btn block" onclick="saveSettings()">Save Settings</button></div><div class="section-title"><h2>Telegram Signals</h2></div><div class="card"><div class="telegram-card"><div class="symbol">Shared Telegram Delivery</div><div class="subtle">Use one Telegram group containing you, your spouse and your bot. Bot token stays only in Cloudflare Worker Secrets, never in GitHub.</div></div><div class="form-grid" style="margin-top:10px"><div class="field full"><label>Cloudflare Worker URL</label><input id="sTgWorker" value="${state.settings.telegramWorkerUrl||''}" placeholder="https://tajdara-signal.yourname.workers.dev"></div><div class="field full"><label>Pairing Key</label><input id="sTgKey" type="password" value="${state.settings.telegramPairingKey||''}" placeholder="Your private shared pairing key"></div></div><div class="field full" style="margin-top:10px"><label><input id="sNewsAlerts" type="checkbox" ${state.settings.newsAlerts!==false?'checked':''}> Send HIGH-impact market news to Telegram</label></div><div id="tgStatus" class="security-note" style="margin-top:10px"><span class="amber">NOT TESTED</span><div class="subtle" style="margin-top:4px">Run Worker Health first, then Send Telegram Test.</div></div><div class="row wrap" style="margin-top:10px"><button class="btn secondary" onclick="testWorkerConnection()">Worker Health</button><button class="btn secondary" onclick="testTelegram()">Send Telegram Test</button><button class="btn secondary" onclick="syncTelegramState(true)">Sync 24/7 Signals & News</button></div><div class="security-note">v8.1 shows the real Worker error instead of a generic Failed message. The Telegram test uses the values currently typed above even before Save Settings is pressed.</div></div><div class="section-title"><h2>Security</h2></div><div class="card"><div class="security-grid"><button class="btn secondary" onclick="changePasswordModal()">Change Password</button><button class="btn secondary" onclick="lockNow()">Lock Now</button></div><div class="security-note">The app locks after 10 minutes of inactivity. Password verification stays on this device and is never sent to NX, TX, DX, BN or GitHub.</div></div><div class="section-title"><h2>About</h2></div><div class="card"><div class="symbol">TAJDARA M&M Universal v9</div><div class="subtle">Live exchange-style charting, SMC overlays, trade markers and shared Telegram signal relay.</div></div><div class="section-title"><h2>Privacy</h2></div><div class="card"><div class="warning">No exchange account connection. No private exchange API keys. No balances. No automatic order execution. TX, NX and BN use public market data. DX uses local price snapshots unless a verified public Digikala feed becomes available. Telegram bot credentials belong only in Cloudflare Worker Secrets.</div></div><div class="section-title"><h2>Data</h2></div><div class="card"><div class="row wrap"><button class="btn secondary" onclick="exportData()">Export Backup</button><button class="btn secondary" onclick="importData()">Import Backup</button></div><div class="hr"></div><div class="subtle">Journal and settings are stored locally in this browser / installed PWA.</div></div>`;}
function saveSettings(){state.settings.capital=+$(`#sCap`).value;state.settings.riskPct=+$(`#sRisk`).value;let old=+state.settings.dxGoldPrice||0,nw=+$(`#sGold`).value||0;state.settings.dxGoldPrice=nw;state.settings.webhookUrl=$(`#sWebhook`).value.trim();state.settings.telegramWorkerUrl=$(`#sTgWorker`)?.value.trim()||'';state.settings.telegramPairingKey=$(`#sTgKey`)?.value.trim()||'';state.settings.newsAlerts=$(`#sNewsAlerts`)?.checked!==false;if(nw>0&&nw!==old){state.dxHistory=state.dxHistory||[];state.dxHistory.push({t:Date.now(),price:nw});state.dxHistory=state.dxHistory.slice(-1000);}save();render();toast('Settings saved');syncTelegramState();}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TAJDARA_MM_backup.json';a.click();URL.revokeObjectURL(a.href);}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{state=JSON.parse(await i.files[0].text());save();render();toast('Backup imported')}catch{toast('Invalid backup')}};i.click();}
$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));$('#refreshAll').addEventListener('click',refreshPrices);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});boot();

</script>
</body>
